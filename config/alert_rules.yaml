alerts:
  - name: high_latency_slo_breach
    severity: warning
    condition: "latency_p95_ms > 3000"
    duration: 10m
    type: symptom-based
    channel: slack
    owner: on-call-llmops
    runbook: docs/alerts.md#alert-1
  - name: elevated_request_errors
    severity: critical
    condition: "error_rate_pct > 2"
    duration: 5m
    type: symptom-based
    channel: slack
    owner: on-call-llmops
    runbook: docs/alerts.md#alert-2
  - name: low_retrieval_success
    severity: warning
    condition: "retrieval_success_rate_pct < 90"
    duration: 10m
    type: symptom-based
    channel: slack
    owner: on-call-llmops
    runbook: docs/alerts.md#alert-3
